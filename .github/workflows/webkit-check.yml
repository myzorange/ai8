name: webkit-check
# Temporary self-check of the AI 八堂课 preview on WebKit: real Safari (macOS), iOS Safari (simulator), Playwright WebKit (iPhone emulation).
on:
  push:
    branches: [ci-webkit-check]
    paths-ignore: ['results/**']
permissions:
  contents: write
concurrency:
  group: webkit-check
  cancel-in-progress: true
jobs:
  safari:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install selenium==4.25.0 pillow==10.4.0
      - run: sudo safaridriver --enable
      - run: python ci/safari_check.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari
          path: out/
          if-no-files-found: ignore
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0 pillow==10.4.0
      - run: python -m playwright install --with-deps webkit
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: python ci/webkit_check.py
        env:
          ONLY: iphone_port
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit
          path: out/
          if-no-files-found: ignore
  asr:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install faster-whisper==1.1.1 av==13.1.0 requests==2.32.3
      - run: python ci/asr.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asr
          path: out/
          if-no-files-found: ignore
  publish:
    needs: [safari, webkit, asr]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: results
      - run: |
          ls -R results | head -200
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git commit -q -m "CI results ${GITHUB_RUN_ID}" || exit 0
          git push

<style>[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-text-size-adjust:100%}img{max-width:100%}</style>

<style>
/* Layout: a dark screening room. Home = lesson grid; lesson = film stage, captions, then game and sources stacked below */
:root{
  --ink:#0d1015;--panel:#161b22;--panel2:#1c232c;--paper:#ece6d7;--muted:#8b939d;--ember:#e9a640;--frost:#8db3c8;--fail:#cf6553;--ok:#7fb27a;--line:#28303a;
  --serif:"Noto Serif SC","Songti SC","STSong",serif;--sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:dark
}
html,body{background:var(--ink);color:var(--paper)}
body{font-family:var(--sans);font-size:15px;line-height:1.7;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:880px;margin:0 auto}
button{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--frost);outline-offset:2px}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--muted)}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0;text-wrap:balance}
.hero{display:flex;flex-direction:column;gap:8px;padding-block:12px 24px}
.hero h1{font-size:clamp(30px,7vw,46px);line-height:1.2}
.hero h1 em{font-style:normal;color:var(--ember)}
.hero p{margin:0;color:var(--muted);max-width:34em}
.prog{display:flex;align-items:center;gap:12px;margin-top:8px;font-size:13px;color:var(--muted)}
.prog .track{flex:1;max-width:260px;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--ember);width:0;transition:width .6s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.lc{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;color:var(--paper);cursor:pointer;min-width:0}
.lc:hover{border-color:var(--muted)}
.lc .num{font-size:12px;letter-spacing:.12em;color:var(--ember)}
.lc.now{border-color:var(--ember)}
.lc .num em{font-style:normal;margin-left:8px;padding:0 8px;border-radius:999px;background:var(--ember);color:var(--ink);letter-spacing:0}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.term{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--paper);cursor:pointer;min-height:92px;min-width:0}
.term b{font-family:var(--serif);font-size:17px;font-weight:700}
.term .tl{font-size:11px;color:var(--muted);letter-spacing:.08em}
.term .td{display:none;font-size:13px;line-height:1.6;color:var(--paper)}
.term.flip{border-color:var(--ember);background:var(--panel2)}
.term.flip .td{display:block}
.term.flip b{color:var(--ember)}
select{font:inherit;font-size:14px;color:var(--paper);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.anslist{text-align:left;max-width:32em;display:flex;flex-direction:column;gap:6px}
.anslist p{margin:0;font-size:14px;line-height:1.7;color:var(--paper)}
.anslist b{color:var(--ember)}
.lc h3{font-size:18px;line-height:1.4}
.lc .sub{font-size:13px;color:var(--muted);line-height:1.6}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:12px;padding:1px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.on{border-color:var(--ember);color:var(--ember)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.btn{font-size:14px;color:var(--paper);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 16px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--ember);border-color:var(--ember);color:var(--ink);font-weight:500}
.lhead{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.lhead h1{font-size:clamp(22px,5vw,30px)}
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:var(--ink);border:1px solid var(--line)}
@media (max-width:600px){.stage{aspect-ratio:4/5}}
canvas{display:block;width:100%;height:100%;cursor:pointer}
.veil{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(13,16,21,.55);text-align:center;padding:16px}
.big{font-size:16px;font-weight:500;color:var(--ink);background:var(--ember);border:0;border-radius:999px;padding:12px 28px;cursor:pointer}
.hint{font-size:13px;color:var(--muted)}
.end{background:rgba(13,16,21,.9);overflow:auto;justify-content:flex-start;padding-top:24px}
.end h2{font-size:22px;color:var(--ember)}
.end ol{margin:0;padding-left:1.4em;text-align:left;font-size:15px;line-height:1.8;max-width:30em}
.scene{font-size:12px;letter-spacing:.14em;color:var(--ember);margin-top:14px}
.cap{min-height:5.4em;font-family:var(--serif);font-weight:500;font-size:17px;line-height:1.75;margin:2px 0 8px;max-width:40em}
.bar{display:flex;gap:4px}
.seg{flex:1;height:6px;border:0;padding:0;border-radius:3px;background:var(--line);position:relative;overflow:hidden;cursor:pointer}
.seg i{position:absolute;inset:0 auto 0 0;background:var(--ember);width:0}
.ctrl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.ctrl .btn{min-width:84px}
.sec{margin-top:36px;display:flex;flex-direction:column;gap:12px}
.sec h2{font-size:20px}
.game{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.links{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.links a{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);color:var(--paper);text-decoration:none}
.links a span:last-child{color:var(--muted);font-size:13px;flex-shrink:0}
.links a:hover span:first-child{color:var(--ember)}
.lnav{display:flex;justify-content:space-between;gap:12px;margin-top:36px}
/* games */
.gtop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-size:13px;padding:3px 12px;border-radius:999px;background:rgba(233,166,64,.14);color:var(--ember)}
.gmeta{font-size:13px;color:var(--muted);margin:0}
.say{display:flex;gap:10px;align-items:flex-start}
.ava{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--ember);color:var(--ember);font-weight:500}
.say p{margin:0;background:var(--panel2);border-radius:12px;padding:10px 14px;min-width:0}
.gq{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.5;margin:0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.opt{font-size:15px;color:var(--paper);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:11px 10px;cursor:pointer;min-height:46px}
.opt:hover{border-color:var(--muted)}
.opt.right{border-color:var(--ok);background:rgba(127,178,122,.16);color:var(--ok)}
.opt.wrong{border-color:var(--fail);background:rgba(207,101,83,.16);color:var(--fail)}
.opt.done{opacity:.45;cursor:default}
.why{font-size:14px;color:var(--muted);margin:0;line-height:1.7}
.why b{color:var(--paper);font-weight:500}
.gbtns{display:flex;gap:10px;flex-wrap:wrap}
.row{display:flex;align-items:center;gap:10px}
.row .lb{font-size:14px;color:var(--muted);min-width:64px}
.row input{flex:1;min-width:0;accent-color:var(--ember)}
.row .val{font-weight:500;min-width:26px;text-align:right}
.c4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cell{background:var(--panel2);border:1px solid var(--fail);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--muted)}
.cell.ok{border-color:var(--ok);background:rgba(127,178,122,.12)}
.cell b{display:block;font-size:15px;font-weight:500;color:var(--paper)}
.cell.ok b{color:var(--ok)}
.pbars{display:flex;flex-direction:column;gap:6px}
.pb{display:grid;grid-template-columns:64px minmax(0,1fr) 44px;align-items:center;gap:8px;font-size:14px}
.pb .t{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.pb .t i{display:block;height:100%;width:0;background:var(--frost);transition:width .7s}
.pb.me .t i{background:var(--ember)}
.pb span:last-child{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column-reverse;gap:4px}
.stack div{font-size:14px;padding:6px 12px;border-radius:6px;background:rgba(233,166,64,.14);color:var(--ember);text-align:center}
.meters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.m{background:var(--panel2);border-radius:8px;padding:10px 12px}
.m small{display:block;font-size:12px;color:var(--muted)}
.m b{font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.m .t{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.m .t i{display:block;height:100%;transition:width .5s}
.log{font-size:14px;margin:0;min-height:3.4em}
.final{background:var(--panel2);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.opt small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
#nextL{margin-left:auto}
.final div{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px;font-size:14px}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.pb .t i,.m .t i,.prog .track i{transition:none}}
</style>

<div class="wrap">
  <section id="home">
    <div class="hero">
      <span class="eyebrow">跟着 Nick Saraev 的 AI 路线图</span>
      <h1>AI <em>八</em>堂课</h1>
      <p>每课一部两分钟的动画、一个闯关游戏和博主推荐的原始资料。按顺序学，一周就能从零看懂 AI。</p>
      <div class="prog"><span id="progTxt">已完成 0 / 8</span><span class="track"><i id="progBar"></i></span></div>
      <div><button class="btn pri" id="cont">开始学习</button></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="sec">
      <div class="top" style="margin:0"><div><span class="eyebrow">复习</span><h2>术语卡片</h2></div>
        <select id="termFilter" aria-label="按课筛选"><option value="all">全部 24 张</option><option value="1">第 1 课</option><option value="2">第 2 课</option><option value="3">第 3 课</option><option value="4">第 4 课</option><option value="5">第 5 课</option><option value="6">第 6 课</option><option value="7">第 7 课</option><option value="8">第 8 课</option></select></div>
      <span class="hint">先想想它是什么意思，再点卡片看解释</span>
      <div class="terms" id="terms"></div>
    </div>
  </section>

  <section id="lesson" hidden>
    <div class="top">
      <button class="btn" id="back">← 全部课程</button>
      <span class="eyebrow" id="lnum"></span>
    </div>
    <div class="lhead">
      <h1 id="ltitle"></h1>
      <span class="hint" id="lsub"></span>
    </div>
    <div class="stage">
      <canvas id="cv" aria-label="课程动画"></canvas>
      <div class="veil" id="start">
        <button class="big" id="go">播放</button>
        <span class="hint">点画面暂停，下方进度条可跳到任意一幕</span>
      </div>
      <div class="veil end" id="end" hidden>
        <h2 id="endT"></h2>
        <ol id="quiz"></ol>
        <span class="hint">先自己想一想，再看参考答案</span>
        <button class="btn" id="ansBtn">看参考答案</button>
        <div class="anslist" id="ans" hidden></div>
        <div class="gbtns" style="justify-content:center">
          <button class="big" id="toGame">去闯关</button>
          <button class="btn" id="again">重看一遍</button>
        </div>
      </div>
    </div>
    <div class="scene" id="sname"></div>
    <p class="cap" id="cap" aria-live="polite"></p>
    <div class="bar" id="bar"></div>
    <div class="ctrl">
      <button class="btn" id="prev">上一幕</button>
      <button class="btn" id="play">播放</button>
      <button class="btn" id="next">下一幕</button>
      <button class="btn" id="narr" aria-pressed="true">旁白：开</button>
    </div>

    <div class="sec" id="gameSec">
      <span class="eyebrow">闯关</span>
      <h2 id="gname"></h2>
      <div class="game" id="game"></div>
    </div>

    <div class="sec">
      <span class="eyebrow">原始资料</span>
      <h2>想深入，就看这些</h2>
      <ul class="links" id="links"></ul>
    </div>

    <div class="lnav">
      <button class="btn" id="prevL">← 上一课</button>
      <button class="btn pri" id="nextL">下一课 →</button>
    </div>
  </section>
</div>

<script>

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const css=getComputedStyle(document.documentElement);
const C={};['ink','panel','panel2','paper','muted','ember','frost','fail','ok','line'].forEach(k=>C[k]=css.getPropertyValue('--'+k).trim());
const SERIF=css.getPropertyValue('--serif'),SANS=css.getPropertyValue('--sans');
let W=0,H=0,u=1;
function resize(){const r=cv.getBoundingClientRect();const d=Math.min(2,window.devicePixelRatio||1);W=r.width;H=r.height;if(!W||!H)return;cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);u=Math.min(W,H)/100}
const cl=x=>x<0?0:x>1?1:x,seg=(t,a,b)=>cl((t-a)/(b-a)),eo=x=>1-Math.pow(1-x,3),lerp=(a,b,p)=>a+(b-a)*p;
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rgba(h,a){const n=parseInt(h.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`}
function txt(s,x,y,size,col,a=1,f='serif',al='center',wt=700){if(a<=0)return;ctx.font=`${wt} ${size}px ${f==='serif'?SERIF:SANS}`;ctx.textAlign=al;ctx.textBaseline='middle';ctx.fillStyle=rgba(col,a);ctx.fillText(s,x,y)}
function dot(x,y,r,fill){if(r<=0)return;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill()}
function ring(x,y,r,col,w){if(r<=0)return;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.strokeStyle=col;ctx.lineWidth=w;ctx.stroke()}
function glow(x,y,r,h,a){if(a<=0||r<=0)return;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(h,a));g.addColorStop(1,rgba(h,0));ctx.fillStyle=g;ctx.fillRect(x-r,y-r,2*r,2*r)}
function line(x1,y1,x2,y2,col,w){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=col;ctx.lineWidth=w;ctx.stroke()}
function year(y,t){txt(y,6*u,11*u,10*u,C.ember,seg(t,0.2,1.4)*0.9,'serif','left',700)}
function tag(s,t){txt(s,6*u,9*u,3.6*u,C.ember,seg(t,0.2,1.2)*0.9,'sans','left',500)}
function wrap(s,x,y,maxW,size,col,a,lh,f='sans',wt=400){let ln='',yy=y;ctx.font=`${wt} ${size}px ${f==='serif'?SERIF:SANS}`;for(const ch of s){if(ctx.measureText(ln+ch).width>maxW&&ln){txt(ln,x,yy,size,col,a,f,'left',wt);ctx.font=`${wt} ${size}px ${f==='serif'?SERIF:SANS}`;ln=ch;yy+=lh}else ln+=ch}if(ln)txt(ln,x,yy,size,col,a,f,'left',wt);return yy+lh}
function chips(list,cy,a,hi,col){const fs=3.2*u,pad=2.6*u,gap=2*u;ctx.font=`500 ${fs}px ${SANS}`;const ws=list.map(s=>ctx.measureText(s).width+pad*2);const rows=[[]];let rw=0;ws.forEach((w,i)=>{if(rw+w>W*0.9&&rows[rows.length-1].length){rows.push([]);rw=0}rows[rows.length-1].push(i);rw+=w+gap});
rows.forEach((r,ri)=>{const tot=r.reduce((p,i)=>p+ws[i]+gap,-gap);let x=W/2-tot/2;const y=cy+ri*8*u;r.forEach(i=>{const on=hi===i||hi===-2,c=col||C.ember;box(x,y-3.2*u,ws[i],6.4*u,3.2*u,rgba(on?c:C.panel2,on?0.18*a:a),rgba(on?c:C.line,a),0.3*u);txt(list[i],x+ws[i]/2,y,fs,on?c:C.paper,a,'sans','center',500);x+=ws[i]+gap})})}
function arrowHead(x,y,ang,s,col){ctx.beginPath();ctx.moveTo(x+Math.cos(ang)*s,y+Math.sin(ang)*s);ctx.lineTo(x+Math.cos(ang+2.5)*s,y+Math.sin(ang+2.5)*s);ctx.lineTo(x+Math.cos(ang-2.5)*s,y+Math.sin(ang-2.5)*s);ctx.closePath();ctx.fillStyle=col;ctx.fill()}

const R=rng(11),NODES=[],EDGES=[];
for(let i=0;i<80;i++)NODES.push({x:0.05+R()*0.9,y:0.06+R()*0.88,p:R()*6.28});
NODES.forEach((a,i)=>{const d=NODES.map((b,j)=>[Math.hypot(a.x-b.x,a.y-b.y),j]).sort((p,q)=>p[0]-q[0]);for(let k=1;k<=2;k++)if(d[k][1]>i)EDGES.push([i,d[k][1]])});
function constellation(t,prog,br){
  const n=Math.floor(EDGES.length*prog);
  for(let k=0;k<n;k++){const a=NODES[EDGES[k][0]],b=NODES[EDGES[k][1]];line(a.x*W,a.y*H,b.x*W,b.y*H,rgba(C.ember,0.18*br),0.25*u)}
  NODES.forEach((p,i)=>{const on=i/NODES.length<prog+0.1;const tw=0.5+0.5*Math.sin(t*1.6+p.p);if(on){glow(p.x*W,p.y*H,3*u,C.ember,0.25*br*tw);dot(p.x*W,p.y*H,0.7*u,rgba(C.ember,(0.4+0.6*tw)*br))}else dot(p.x*W,p.y*H,0.5*u,rgba(C.muted,0.35))});
}
const S2=rng(5),SNOW=[];for(let i=0;i<150;i++)SNOW.push({x:S2(),y:S2(),s:0.03+S2()*0.06,r:0.3+S2()*0.6,w:S2()*6});
function snow(t,a){if(a<=0)return;SNOW.forEach(f=>{const y=(f.y+t*f.s)%1,x=(f.x+Math.sin(t*0.6+f.w)*0.01);dot(x*W,y*H,f.r*u,rgba(C.paper,0.55*a))})}

const SC1=[
{name:'序',dur:8,caps:[[0.5,'这是一个关于等待的故事。'],[4,'一个想法，从诞生到被世界接受，等了整整66年。']],

function game5(el,win){const LIM=12,ROUNDS=8;let s;
function reset(){s={r:0,cap:10,safe:10,rival:10,over:'',log:'你是一家 AI 实验室的负责人。每轮选一个策略。8 轮后，你的能力要追上对手，而且全程不能失控：能力领先安全超过 12，就会出事故。提示：先打好安全底子，后面的进步会越来越快。'};render()}
const meter=(l,v,mx,c)=>`<div class="m"><small>${l}</small><b>${v.toFixed(1)}</b><div class="t"><i style="width:${Math.max(0,Math.min(100,v/mx*100))}%;background:${c}"></i></div></div>`;
function act(k){const m=1+s.cap/25;let d;if(k===0){const g=4*m;s.cap+=g;d='全速研发：能力 +'+g.toFixed(1)}else if(k===1){const g=2*m;s.cap+=g;s.safe+=4;d='边研发边评估：能力 +'+g.toFixed(1)+'，安全 +4'}else{s.safe+=6;d='暂停做安全研究：安全 +6'}s.rival+=4;s.r++;const gap=s.cap-s.safe;
if(gap>LIM){s.over='crash';s.log=d+'。能力领先安全 '+gap.toFixed(1)+'，模型失控了。这就是“控速”派担心的事。'}else if(s.r>=ROUNDS){if(s.cap>=s.rival){s.over='win';s.log=`8 轮结束：你的能力 ${s.cap.toFixed(1)}，对手 ${s.rival.toFixed(1)}，全程没有失控。你在竞争和安全之间走通了钢丝，这正是阿莫迪说的“控速”。`;win()}else{s.over='slow';s.log=`你很安全，但能力 ${s.cap.toFixed(1)} 落后对手 ${s.rival.toFixed(1)}，市场被别人拿走了。太慢也会输。`}}else s.log=d+'。'+(m>1.6?' 注意：模型越强，下一轮进步越快，这就是递归自我改进。':'');render()}
function render(){const gap=s.cap-s.safe;el.innerHTML=`<div class="gtop"><span class="pill">${s.over==='win'?'通关':s.over?'游戏结束':'第 '+(s.r+1)+' / '+ROUNDS+' 轮'}</span><span class="gmeta">失控线：领先超过 ${LIM}</span></div>
<div class="meters">${meter('你的能力',s.cap,70,'var(--ember)')}${meter('对手能力',s.rival,70,'var(--muted)')}${meter('安全水平',s.safe,70,'var(--frost)')}${meter('能力领先安全',gap,LIM,gap>LIM*0.7?'var(--fail)':'var(--ok)')}</div><p class="log">${s.log}</p>
${s.over?`<div class="gbtns"><button class="btn pri" id="g5re">${s.over==='win'?'再玩一次':'重新来过'}</button></div>`:`<div class="opts"><button class="opt" data-k="0">全速研发<small>能力大涨，安全不变</small></button><button class="opt" data-k="1">边研发边评估<small>能力小涨，安全 +4</small></button><button class="opt" data-k="2">暂停做安全<small>能力不变，安全 +6</small></button></div>`}`;
el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>act(+b.dataset.k));const re=el.querySelector('#g5re');if(re)re.onclick=reset}
reset()}

['AI 背后是一整条实体产业链：光刻机、芯片、数据中心、电力。它们受物理条件、资金和政治的约束。','ASML 造光刻机，也就是造芯片的机器；台积电按设计图生产芯片；英伟达设计芯片。','大多数人在最外层“应用”。用 Claude Code 这类工具时，也会接触到“智能体工具”这一层。'],
['OpenAI 什么都做，聊天、图像、视频、语音，像百货公司；Anthropic 几乎只押编程，想让模型帮忙研发下一代模型。','谷歌资格老、全栈齐备，但大公司流程慢，早期反应迟钝。可一旦发力，惯性很大，很难停下。','算力。它靠造工厂的能力，在孟菲斯建起超大算力集群 Colossus。'],
['让 AI 自己做 AI 的研发，造出更强的 AI，再让更强的 AI 继续研发，循环往复。','只要有算力和电，AI 研究员就能无限复制、同时开工；人类研究员一个人只有一个大脑。','乐观派（奥特曼）：变化会平稳到来，世界更富足。谨慎派（阿莫迪）：要主动控速，让外部评估员常驻实验室。怀疑派（MIT 科技评论的报道）：AI 擅长能打分的窄任务，开放式研究还不行，自我改进没那么快。'],

function step(dt){const s=SC[si];let hold=s.dur-0.7;s.caps.forEach(c=>{if(c[0]>st&&c[0]-0.05<hold)hold=c[0]-0.05});
const real=dt;if(narr){let k=-1;s.caps.forEach((c,j)=>{if(st>=c[0])k=j});if(k>=0){const a=s.caps[k][0],b=k+1<s.caps.length?s.caps[k+1][0]:s.dur-0.7,id=(cur+1)+'_'+si+'_'+k,need=(HASVO&&VO[id]?VO[id]+0.4:s.caps[k][1].length/5.5+0.5);if(need>b-a)dt*=(b-a)/need}}if(held<14&&speaking()&&st+dt>=hold-0.02){dt=Math.max(0,hold-0.02-st);held+=real}st+=dt;
s.caps.forEach((c,k)=>{const key=si+':'+k;if(st>=c[0]&&!spoken.has(key)){spoken.add(key);held=0;say(c[1],(cur+1)+'_'+si+'_'+k)}});
if(st>=s.dur){if(si<SC.length-1){si++;st=0}else{st=s.dur;setPlay(false);endEl.hidden=false;mark(cur,'f')}}}
function frame(ts){if(last==null)last=ts;const dt=Math.min(0.05,(ts-last)/1000);last=ts;if(!lessonV.hidden&&SC.length){if(playing)step(dt);draw();ui()}requestAnimationFrame(frame)}
$('go').onclick=()=>{unlock();si=0;st=0;spoken.clear();setPlay(true)};$('again').onclick=()=>{unlock();jump(0)};
playB.onclick=()=>{unlock();if(!endEl.hidden){jump(0);return}if(!startEl.hidden){si=0;st=0;spoken.clear()}setPlay(!playing)};
$('prev').onclick=()=>{unlock();jump(st>1.5?si:si-1)};$('next').onclick=()=>{unlock();jump(si+1)};
cv.onclick=()=>{if(endEl.hidden){unlock();if(!startEl.hidden){si=0;st=0;spoken.clear()}setPlay(!playing)}};
$('narr').onclick=()=>{narr=!narr;try{localStorage.setItem('ai8n',narr?'1':'0')}catch(e){}if(!narr)hush();else{unlock();lastSpokenReset()}narrUI()};
$('ansBtn').onclick=()=>{const a=$('ans');a.hidden=!a.hidden;$('ansBtn').textContent=a.hidden?'看参考答案':'收起答案'};
$('toGame').onclick=()=>$('gameSec').scrollIntoView({behavior:'smooth',block:'start'});
$('back').onclick=goHome;$('prevL').onclick=()=>openLesson(cur-1);$('nextL').onclick=()=>openLesson(cur+1);$('termFilter').onchange=renderHome;
document.addEventListener('keydown',e=>{if(lessonV.hidden||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.code==='Space'&&e.target===document.body){e.preventDefault();playB.click()}else if(e.key==='ArrowRight'&&startEl.hidden)jump(si+1);else if(e.key==='ArrowLeft'&&startEl.hidden)jump(st>1.5?si:si-1);else if(e.key==='Escape')goHome()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)setPlay(false)});
new ResizeObserver(()=>{resize();draw()}).observe(cv);
narrUI();renderHome();const hm=/^#l([1-8])$/.exec(location.hash||'');if(hm)openLesson(+hm[1]-1);
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!/claude/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
requestAnimationFrame(frame);
</script>
